<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELZAIN | 디자인 전문회사</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', sans-serif; background: #111; color: #fff; }
        header { padding: 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        nav a { color: #aaa; margin-left: 20px; text-decoration: none; }
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
        .hero h1 { font-size: 64px; margin: 0 0 20px 0; line-height: 1.2; }
        .hero p { font-size: 20px; color: #888; max-width: 600px; }
        .portfolio { padding: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .project { background: #222; height: 250px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        footer { padding: 40px; text-align: center; color: #444; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SELZAIN</div>
        <nav>
            <a href="#work">Work</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>We Design<br>Digital Experiences.</h1>
            <p>셀자인은 가치를 시각화하는 디자인 전문회사입니다. 브랜드의 아이덴티티를 정교한 디자인으로 구축합니다.</p>
        </section>
        <section class="portfolio" id="work">
            <div class="project">Project 01</div>
            <div class="project">Project 02</div>
            <div class="project">Project 03</div>
        </section>
    </main>
    <footer id="contact">
        <p>&copy; 2026 SELZAIN. All rights reserved. info@selzain.com</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELZAIN | 디자인 스튜디오</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', sans-serif; background: #050505; color: #fff; }
        header { padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; fixed: top; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 5px; }
        nav a { color: #555; margin-left: 30px; text-decoration: none; font-size: 14px; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { color: #fff; }
        .hero { height: 80vh; display: flex; align-items: flex-end; padding: 60px; box-sizing: border-box; }
        .hero h1 { font-size: 8vw; font-weight: 700; line-height: 0.9; margin: 0; letter-spacing: -3px; text-transform: uppercase; }
        .intro-box { padding: 100px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; border-top: 1px solid #222; }
        .intro-box p { font-size: 24px; line-height: 1.6; color: #999; margin: 0; }
        .intro-box p strong { color: #fff; }
        .work-grid { padding: 20px 60px 100px 60px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 40px; }
        .card { background: #111; min-height: 400px; display: flex; align-items: flex-end; padding: 30px; box-sizing: border-box; border: 1px solid #1a1a1a; transition: 0.4s; }
        .card:hover { border-color: #555; background: #151515; }
        .w-7 { grid-column: span 7; } .w-5 { grid-column: span 5; }
        .card h3 { font-size: 28px; font-weight: 500; margin: 0; }
        footer { padding: 60px; border-top: 1px solid #222; text-align: space-between; display: flex; color: #333; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SELZAIN</div>
        <nav><a href="#about">About</a><a href="#work">Work</a><a href="#contact">Contact</a></nav>
    </header>
    <main>
        <section class="hero">
            <h1>We Shape<br>The Value.</h1>
        </section>
        <section class="intro-box" id="about">
            <p><strong>셀자인</strong>은 브랜드의 본질을 정교한 시각 언어로 정립하는 통합 디자인 솔루션 스튜디오입니다.</p>
            <p style="font-size: 16px; color: #555;">CI·BI 개발부터 패키지 구조, 캐릭터, 편집 디자인, 마케팅 비주얼까지 브랜드 성장에 필수적인 시각 커뮤니케이션 전반을 설계합니다.</p>
        </section>
        <section class="work-grid" id="work">
            <div class="card w-7"><h3>CI & BI System</h3></div>
            <div class="card w-5"><h3>Package Design</h3></div>
            <div class="card w-5"><h3>Character Design</h3></div>
            <div class="card w-7"><h3>Editorial System</h3></div>
        </section>
    </main>
    <footer id="contact">
        <div>&copy; 2026 SELZAIN.</div>
        <div>info@selzain.com</div>
    </footer>
</body>
</html>
